name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*third-party*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: primind-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-third-party-bundle.sh
          bash ./scripts/test-third-party-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # The first push of a branch, or a force-push whose old tip is
              # no longer reachable, leaves no usable base; fall back to the
              # parent commit, then to checking every Go file.
              base=$(git rev-parse --verify --quiet HEAD^ 2>/dev/null || true)
            fi
            if [ -z "$base" ]; then
              diff_range=""
            else
              diff_range="$base..$GITHUB_SHA"
            fi
          fi
          if [ -z "$diff_range" ]; then
            unformatted=$(git ls-files -z -- '*.go' ':!cli/**' | xargs -0 -r gofmt -l)
          else
            unformatted=$(
              git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
                xargs -0 -r gofmt -l
            )
          fi
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify generated model catalog
        run: python3 scripts/model-catalog/generate.py --check

      - name: Verify Git hook test coverage
        run: bash ./scripts/test-git-hooks.sh

      - name: Vet and test
        shell: bash
        run: |
          # Capture first so a failing go list cannot be hidden by mapfile's
          # process substitution and leave only a partial package set tested.
          package_list=$(go list ./...)
          mapfile -t pkgs < <(printf '%s\n' "$package_list" | grep -v '/docreader/')
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo 'No application packages found'
            exit 1
          fi
          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"
          go test -tags desktop ./internal/container

      - name: Build server
        run: go build ./cmd/server
