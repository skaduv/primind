name: Sync images to Aliyun ACR

# 把 GHCR 上的自研镜像（main 系列）同步到阿里云 ACR 个人版（ioply 命名空间），
# 供国内服务器就近拉取。ACR 侧使用语义化版本 tag（如 v0.0.1），
# 触发时通过 version 输入指定；sandbox 变体在版本后加 -cube / -desktop 后缀。
#
# 注意：GHCR 镜像是 buildx 构建的多架构索引，带 provenance 证明清单
# （application/vnd.oci.empty.v1+json），ACR 个人版不认识该类型、整索引复制会被拒。
# 因此按平台分别复制 amd64 / arm64 单架构镜像，再用 crane index append
# 重新拼成多架构索引。各平台镜像的 digest 与 GHCR 保持一致，
# 仅索引 digest 因去掉证明清单而不同。
#
# ACR 命名空间开启了自动创建仓库，首次推送即建仓（私有）。
# 需要仓库 Secrets：ACR_USERNAME、ACR_PASSWORD（ACR 访问凭证密码）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ACR 侧版本 tag（如 v0.0.1）"
        required: true
        default: "v0.0.1"

env:
  ACR_REGISTRY: crpi-qkgwmmx35dpzqzz1.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ioply

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo mv crane /usr/local/bin/

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | crane auth login "$ACR_REGISTRY" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Copy images GHCR -> ACR (per-platform, rebuild index)
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DST="$ACR_REGISTRY/$ACR_NAMESPACE"
          sync_image() {
            # $1=镜像名 $2=GHCR 源 tag $3=ACR 目标 tag
            echo "== $1:$2 -> $1:$3"
            crane copy --platform linux/amd64 "ghcr.io/skaduv/$1:$2" "$DST/$1:$3-amd64"
            crane copy --platform linux/arm64 "ghcr.io/skaduv/$1:$2" "$DST/$1:$3-arm64"
            crane index append -m "$DST/$1:$3-amd64" -m "$DST/$1:$3-arm64" -t "$DST/$1:$3"
          }
          sync_image primind-ui        main              "$VER"
          sync_image primind-app       main              "$VER"
          sync_image primind-docreader main              "$VER"
          sync_image primind-sandbox   main              "$VER"
          sync_image primind-sandbox   main-cube         "$VER-cube"
          sync_image primind-sandbox   main-desktop      "$VER-desktop"
          sync_image primind-sandbox   main-desktop-cube "$VER-desktop-cube"

      - name: Verify per-platform digests match
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DST="$ACR_REGISTRY/$ACR_NAMESPACE"
          check() {
            for plat in linux/amd64 linux/arm64; do
              a=$(crane digest --platform "$plat" "ghcr.io/skaduv/$1:$2")
              b=$(crane digest --platform "$plat" "$DST/$1:$3")
              if [ "$a" = "$b" ]; then
                echo "OK $1:$3 ($plat) $a"
              else
                echo "MISMATCH $1 ($plat) ghcr:$2=$a acr:$3=$b"; exit 1
              fi
            done
          }
          check primind-ui        main              "$VER"
          check primind-app       main              "$VER"
          check primind-docreader main              "$VER"
          check primind-sandbox   main              "$VER"
          check primind-sandbox   main-cube         "$VER-cube"
          check primind-sandbox   main-desktop      "$VER-desktop"
          check primind-sandbox   main-desktop-cube "$VER-desktop-cube"
