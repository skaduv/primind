name: Client SDK

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primind-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SDK vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
