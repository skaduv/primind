name: Go Lint

# Existing lint debt is handled separately; PRs must not add new findings.
# The caller supplies modules from the same deletion/rename-aware diff used
# by CI Gate, avoiding a second filter silently skipping selected modules.
on:
  workflow_call:
    inputs:
      modules:
        description: JSON array of Go modules selected by CI
        required: true
        type: string

concurrency:
  group: primind-go-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GOPROXY: https://proxy.golang.org,direct

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          only-new-issues: false
          args: --new-from-merge-base=${{ github.event.pull_request.base.sha }}
