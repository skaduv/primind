<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F7FE"/>
      <stop offset="100%" stop-color="#E3EEFE"/>
    </linearGradient>
    <linearGradient id="brand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#037EF2"/>
      <stop offset="100%" stop-color="#4DA8FF"/>
    </linearGradient>
    <filter id="soft1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#01315F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg1)"/>
  <circle cx="120" cy="90" r="120" fill="#037EF2" opacity="0.05"/>
  <circle cx="700" cy="520" r="140" fill="#1E90FF" opacity="0.06"/>

  <text x="64" y="84" font-size="32" font-weight="700" fill="#02407E">智能文档检索</text>
  <text x="64" y="116" font-size="15" fill="#037EF2">多模态解析 · 语义理解 · 精准定位</text>

  <g filter="url(#soft1)">
    <rect x="64" y="148" width="672" height="396" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="64" y="148" width="672" height="48" rx="20" fill="#E8F2FE"/>
  <rect x="64" y="176" width="672" height="20" fill="#E8F2FE"/>
  <circle cx="90" cy="172" r="5" fill="#4DA8FF"/>
  <circle cx="108" cy="172" r="5" fill="#8FC5FE"/>
  <circle cx="126" cy="172" r="5" fill="#C9E2FE"/>
  <text x="400" y="177" font-size="12" fill="#1E90FF" text-anchor="middle">Primind · 智能知识搜索</text>

  <g transform="translate(96, 224)">
