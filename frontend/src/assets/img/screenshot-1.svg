    <circle cx="30" cy="26" r="9" fill="none" stroke="#1E90FF" stroke-width="2.5"/>
    <line x1="37" y1="33" x2="44" y2="40" stroke="#1E90FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="32" font-size="15" fill="#A6A6A6">合同中如何约定违约责任？</text>
    <rect x="500" y="10" width="92" height="32" rx="8" fill="url(#brand1)"/>
    <text x="546" y="31" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">搜索</text>
  </g>

  <g transform="translate(96, 300)">
    <rect width="608" height="68" rx="12" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1.5"/>
    <rect x="16" y="14" width="40" height="40" rx="10" fill="#E3EEFE"/>
    <path d="M28 26 H44 M28 34 H44 M28 42 H38" stroke="#037EF2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="72" y="30" font-size="14" font-weight="600" fill="rgba(0,0,0,0.9)">采购合同 · 第七条 违约责任</text>
    <text x="72" y="50" font-size="12" fill="rgba(0,0,0,0.6)">违约方应向守约方支付合同总价款 20% 的违约金……</text>
    <rect x="520" y="22" width="72" height="24" rx="12" fill="#E8F2FE"/>
    <text x="556" y="38" font-size="12" font-weight="600" fill="#037EF2" text-anchor="middle">98% 匹配</text>
  </g>

  <g transform="translate(96, 380)">
    <rect width="608" height="68" rx="12" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1.5"/>
    <rect x="16" y="14" width="40" height="40" rx="10" fill="#EAF1FF"/>
    <path d="M28 24 h12 v18 h-16 v-14 z" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linejoin="round"/>
    <text x="72" y="30" font-size="14" font-weight="600" fill="rgba(0,0,0,0.9)">补充协议.pdf · 第 2 页</text>
    <text x="72" y="50" font-size="12" fill="rgba(0,0,0,0.6)">违约方还应赔偿由此给守约方造成的实际损失……</text>
    <rect x="520" y="22" width="72" height="24" rx="12" fill="#E8F2FE"/>
    <text x="556" y="38" font-size="12" font-weight="600" fill="#037EF2" text-anchor="middle">91% 匹配</text>
  </g>

  <g transform="translate(96, 472)">
