      <rect x="154" y="16" width="64" height="30" rx="15" fill="#E8F2FE"/><text x="186" y="36">Word</text>
      <rect x="228" y="16" width="64" height="30" rx="15" fill="#E8F2FE"/><text x="260" y="36">Excel</text>
      <rect x="302" y="16" width="66" height="30" rx="15" fill="#E8F2FE"/><text x="335" y="36">图片</text>
      <rect x="378" y="16" width="66" height="30" rx="15" fill="#E8F2FE"/><text x="411" y="36">音频</text>
      <rect x="454" y="16" width="92" height="30" rx="15" fill="#E8F2FE"/><text x="500" y="36">Markdown</text>
