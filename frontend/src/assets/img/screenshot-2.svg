<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F7FE"/>
      <stop offset="100%" stop-color="#E3EEFE"/>
    </linearGradient>
    <linearGradient id="brand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#037EF2"/>
      <stop offset="100%" stop-color="#4DA8FF"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#01315F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>
  <circle cx="120" cy="90" r="120" fill="#037EF2" opacity="0.05"/>
  <circle cx="700" cy="520" r="140" fill="#1E90FF" opacity="0.06"/>

  <text x="64" y="84" font-size="32" font-weight="700" fill="#02407E">混合检索策略</text>
  <text x="64" y="116" font-size="15" fill="#037EF2">关键词 + 向量语义 + 知识图谱，多路融合输出最优结果</text>

  <g filter="url(#soft2)">
    <rect x="64" y="148" width="672" height="396" rx="20" fill="#FFFFFF"/>
  </g>

  <!-- BM25 -->
  <g transform="translate(96, 184)">
    <rect width="184" height="220" rx="14" fill="#FFF8EC" stroke="#F7C797" stroke-width="1.5"/>
    <rect width="184" height="48" rx="14" fill="#FEF3E6"/>
    <rect y="34" width="184" height="14" fill="#FEF3E6"/>
    <text x="92" y="31" font-size="16" font-weight="700" fill="#BA431B" text-anchor="middle">BM25 关键词</text>
    <g font-size="12.5" fill="#9E3610">
      <rect x="20" y="70" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#F9E0C7"/><text x="92" y="90" text-anchor="middle">词频权重</text>
      <rect x="20" y="110" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#F9E0C7"/><text x="92" y="130" text-anchor="middle">精确匹配</text>
      <rect x="20" y="150" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#F9E0C7"/><text x="92" y="170" text-anchor="middle">倒排索引</text>
    </g>
    <text x="92" y="206" font-size="13" font-weight="600" fill="#D35A21" text-anchor="middle">擅长精准命中术语</text>
  </g>

  <!-- Vector -->
  <g transform="translate(308, 184)">
    <rect width="184" height="220" rx="14" fill="#EFF5FF" stroke="#A7CEFF" stroke-width="1.5"/>
    <rect width="184" height="48" rx="14" fill="#E8F2FE"/>
    <rect y="34" width="184" height="14" fill="#E8F2FE"/>
    <text x="92" y="31" font-size="16" font-weight="700" fill="#02407E" text-anchor="middle">向量语义</text>
    <g font-size="12.5" fill="#024F9C">
      <rect x="20" y="70" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#D6E8FF"/><text x="92" y="90" text-anchor="middle">文本向量化</text>
      <rect x="20" y="110" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#D6E8FF"/><text x="92" y="130" text-anchor="middle">相似度计算</text>
      <rect x="20" y="150" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#D6E8FF"/><text x="92" y="170" text-anchor="middle">近似检索</text>
    </g>
    <text x="92" y="206" font-size="13" font-weight="600" fill="#037EF2" text-anchor="middle">理解语义与意图</text>
  </g>

  <!-- Graph -->
  <g transform="translate(520, 184)">
    <rect width="184" height="220" rx="14" fill="#F2F8FF" stroke="#7FC2FE" stroke-width="1.5"/>
    <rect width="184" height="48" rx="14" fill="#E8F2FE"/>
    <rect y="34" width="184" height="14" fill="#E8F2FE"/>
    <text x="92" y="31" font-size="16" font-weight="700" fill="#0261BD" text-anchor="middle">知识图谱</text>
    <g font-size="12.5" fill="#024F9C">
      <rect x="20" y="70" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#C9E2FE"/><text x="92" y="90" text-anchor="middle">实体识别</text>
      <rect x="20" y="110" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#C9E2FE"/><text x="92" y="130" text-anchor="middle">关系路径</text>
      <rect x="20" y="150" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#C9E2FE"/><text x="92" y="170" text-anchor="middle">子图匹配</text>
    </g>
    <text x="92" y="206" font-size="13" font-weight="600" fill="#1E90FF" text-anchor="middle">基于关联推理</text>
  </g>

  <g stroke="#1E90FF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M188 412 V446 H400 V470" marker-end="url(#arr2)"/>
    <path d="M400 412 V470" marker-end="url(#arr2)"/>
    <path d="M612 412 V446 H400" />
  </g>

  <g transform="translate(220, 478)">
    <rect width="360" height="50" rx="14" fill="url(#brand2)" filter="url(#soft2)"/>
    <text x="180" y="31" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">RRF 融合排序 → 最优结果</text>
  </g>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#1E90FF"/>
    </marker>
  </defs>
</svg>
